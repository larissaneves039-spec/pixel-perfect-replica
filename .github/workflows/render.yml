name: Render worker

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: render-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install
      - name: Instalar Chrome para Playwright
        run: bunx playwright install chrome --with-deps
      - name: Build do app (estático)
        env:
          VITE_SUPABASE_URL: https://sztvwhkvjusvtbnjmopj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bunx vite build -c vite.pages.config.ts
      - name: Servir o app
        run: |
          nohup bun run scripts/serve-static.ts > preview.log 2>&1 &
      - name: Renderizar fila
        env:
          APP_URL: http://localhost:4173
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: bun run scripts/render-worker.ts
